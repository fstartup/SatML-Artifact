<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="1600" height="900" fill="#FFFFFF"/>
    <rect x="70" y="55" width="10" height="790" rx="5" fill="#0EA5A8"/>
<rect x="80" y="290" width="200" height="145" rx="24" fill="#F7F9FB" stroke="#D9E4EC"/><rect x="108" y="312" width="144" height="48" rx="16" fill="#3B82F6" stroke="#none"/><text x="180" y="345" font-family="Arial" font-size="18px" font-weight="700" fill="#FFFFFF" text-anchor="middle">DETECT</text><text x="180" y="385" font-family="Arial" font-size="15px" font-weight="500" fill="#5B6B7A" text-anchor="middle">Observe anomaly</text><text x="305" y="365" font-family="Arial" font-size="30px" font-weight="700" fill="#5B6B7A" text-anchor="middle">→</text><rect x="330" y="290" width="200" height="145" rx="24" fill="#F7F9FB" stroke="#D9E4EC"/><rect x="358" y="312" width="144" height="48" rx="16" fill="#0EA5A8" stroke="#none"/><text x="430" y="345" font-family="Arial" font-size="18px" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONTAIN</text><text x="430" y="385" font-family="Arial" font-size="15px" font-weight="500" fill="#5B6B7A" text-anchor="middle">Stop expansion</text><text x="555" y="365" font-family="Arial" font-size="30px" font-weight="700" fill="#5B6B7A" text-anchor="middle">→</text><rect x="580" y="290" width="200" height="145" rx="24" fill="#F7F9FB" stroke="#D9E4EC"/><rect x="608" y="312" width="144" height="48" rx="16" fill="#F59E0B" stroke="#none"/><text x="680" y="345" font-family="Arial" font-size="18px" font-weight="700" fill="#FFFFFF" text-anchor="middle">RECOVER</text><text x="680" y="385" font-family="Arial" font-size="15px" font-weight="500" fill="#5B6B7A" text-anchor="middle">Apply bounded recovery</text><text x="805" y="365" font-family="Arial" font-size="30px" font-weight="700" fill="#5B6B7A" text-anchor="middle">→</text><rect x="830" y="290" width="200" height="145" rx="24" fill="#F7F9FB" stroke="#D9E4EC"/><rect x="858" y="312" width="144" height="48" rx="16" fill="#7C3AED" stroke="#none"/><text x="930" y="345" font-family="Arial" font-size="18px" font-weight="700" fill="#FFFFFF" text-anchor="middle">VERIFY</text><text x="930" y="385" font-family="Arial" font-size="15px" font-weight="500" fill="#5B6B7A" text-anchor="middle">Establish actual state</text><text x="1055" y="365" font-family="Arial" font-size="30px" font-weight="700" fill="#5B6B7A" text-anchor="middle">→</text><rect x="1080" y="290" width="200" height="145" rx="24" fill="#F7F9FB" stroke="#D9E4EC"/><rect x="1108" y="312" width="144" height="48" rx="16" fill="#0B1F33" stroke="#none"/><text x="1180" y="345" font-family="Arial" font-size="18px" font-weight="700" fill="#FFFFFF" text-anchor="middle">RECONCILE</text><text x="1180" y="385" font-family="Arial" font-size="15px" font-weight="500" fill="#5B6B7A" text-anchor="middle">Resolve unknowns</text><text x="1305" y="365" font-family="Arial" font-size="30px" font-weight="700" fill="#5B6B7A" text-anchor="middle">→</text><rect x="1330" y="290" width="200" height="145" rx="24" fill="#F7F9FB" stroke="#D9E4EC"/><rect x="1358" y="312" width="144" height="48" rx="16" fill="#22C7D6" stroke="#none"/><text x="1430" y="345" font-family="Arial" font-size="18px" font-weight="700" fill="#FFFFFF" text-anchor="middle">ESCALATE</text><text x="1430" y="385" font-family="Arial" font-size="15px" font-weight="500" fill="#5B6B7A" text-anchor="middle">Hand off authority</text><rect x="260" y="530" width="1080" height="120" rx="24" fill="#0B1F33" stroke="#none"/><text x="800" y="575" font-family="Arial" font-size="27px" font-weight="700" fill="#FFFFFF" text-anchor="middle">Authority must remain monotonic under failure</text><text x="800" y="615" font-family="Arial" font-size="18px" font-weight="500" fill="#FFFFFF" text-anchor="middle">A failed action or failed recovery cannot increase scope, privilege, blast radius or permitted actions.</text>
</svg>